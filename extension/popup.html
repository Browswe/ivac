<!doctype html>
<html><head><meta charset="utf-8"><title>IVAC Assistant</title><style>
*{box-sizing:border-box}body{font:13px Arial;width:410px;margin:0;padding:14px;background:#f5f7fb;color:#172033}
h2{margin:0 0 4px}.muted{font-size:11px;color:#667085}.section{background:white;border:1px solid #e4e7ec;border-radius:9px;padding:10px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}input,select{width:100%;padding:8px;border:1px solid #d0d5dd;border-radius:6px}
label{display:block;font-size:11px;font-weight:600;margin:6px 0 2px}.full{grid-column:1/-1}
button{width:100%;padding:9px;margin-top:7px;border:0;border-radius:7px;background:#155eef;color:white;font-weight:600;cursor:pointer}
button.s{background:#e8eefc;color:#173b7a}button.d{background:#d92d20}.status{font-size:11px;margin-top:8px;min-height:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.toggle{width:auto;margin:0}.watch{font-weight:700}
.small{font-size:10px;color:#667085;line-height:1.4}.ok{color:#067647}.warn{color:#b54708}
</style></head><body>
<h2>IVAC Assistant <span style="font-size:11px">v3.0</span></h2>
<div class="muted">Profiles • Auto Fill • Slot Watch • Alerts</div>

<div class="section">
<label>Applicant Profile</label>
<div class="grid"><select id="profile" class="full"></select><input id="profileName" placeholder="Profile name"><button id="new" class="s">New Profile</button></div>
<div class="grid">
<div><label>Given Name</label><input id="givenName"></div><div><label>Surname</label><input id="surname"></div>
<div><label>Date of Birth</label><input id="dob" type="date"></div><div><label>Gender</label><input id="gender"></div>
<div><label>Nationality</label><input id="nationality" value="Bangladesh"></div><div><label>Marital Status</label><input id="maritalStatus"></div>
<div><label>Passport No.</label><input id="passportNo"></div><div><label>Passport Issue Place</label><input id="passportIssuePlace"></div>
<div><label>Passport Issue Date</label><input id="passportIssueDate" type="date"></div><div><label>Passport Expiry</label><input id="passportExpiryDate" type="date"></div>
<div class="full"><label>Previous Passport / Visa No.</label><input id="previousPassportVisa"></div>
<div><label>Mobile</label><input id="phone"></div><div><label>Email</label><input id="email"></div>
<div class="full"><label>Present Address</label><input id="presentAddress"></div><div><label>District</label><input id="district"></div><div><label>Post Code</label><input id="postCode"></div>
<div><label>Father's Name</label><input id="fatherName"></div><div><label>Mother's Name</label><input id="motherName"></div><div class="full"><label>Spouse Name</label><input id="spouseName"></div>
<div><label>Profession</label><input id="profession"></div><div><label>Employer / Business</label><input id="employer"></div>
<div><label>Visa Type</label><input id="visaType"></div><div><label>Purpose</label><input id="purpose"></div>
<div><label>Mission</label><input id="mission" placeholder="Sylhet"></div><div><label>IVAC Center</label><input id="ivacCenter" placeholder="Sylhet"></div>
<div class="full"><label>Stay / Hotel in India</label><input id="stayAddress"></div><div><label>Web File No.</label><input id="webFileNumber"></div>
<div><label>India Reference Name</label><input id="indiaRefName"></div><div><label>India Reference Phone</label><input id="indiaRefPhone"></div>
<div class="full"><label>India Reference Address</label><input id="indiaRefAddress"></div>
<div><label>Bangladesh Reference Name</label><input id="bdRefName"></div><div><label>Bangladesh Reference Phone</label><input id="bdRefPhone"></div>
<div class="full"><label>Bangladesh Reference Address</label><input id="bdRefAddress"></div>
</div>
<div class="grid"><button id="save">Save Profile</button><button id="fill" class="s">Auto Fill</button><button id="clear" class="s">Clear Form</button><button id="del" class="d">Delete Profile</button></div>
<button id="clearProfiles" class="d">Clear All Saved Profiles</button>
</div>

<div class="section">
<div class="row"><div class="watch">🔔 Slot Watch</div><button id="watch" class="s toggle">OFF</button></div>
<div class="small">Checks the visible appointment page for an available date. It does not bypass CAPTCHA, OTP, login, queues, payment, or security controls.</div>
<div class="grid">
<div><label>Refresh interval (seconds)</label><input id="interval" type="number" min="10" max="300" value="30"></div>
<div><label>Preferred centre</label><input id="preferredCenter" placeholder="Sylhet"></div>
</div>
<button id="check" class="s">Check This Page Now</button>
</div>

<button id="open" class="s">Open IVAC Appointment</button>
<button id="openVisa" class="s">Open Indian Visa Form</button>
<div id="status" class="status"></div>
<script src="popup.js"></script></body></html>
