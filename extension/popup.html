<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>IVAC Assistant</title>
  <style>
    body{font-family:Arial,sans-serif;width:300px;margin:0;padding:16px;background:#f7f9fc;color:#172033}
    h2{margin:0 0 8px;font-size:20px}
    p{font-size:12px;color:#667085}
    input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0;border:1px solid #d0d5dd;border-radius:7px}
    button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:7px;background:#1463ff;color:#fff;cursor:pointer}
    button.secondary{background:#e8eefc;color:#173b7a}
    #status{font-size:12px;margin-top:8px}
  </style>
</head>
<body>
  <h2>IVAC Assistant</h2>
  <p>Save your own form details for faster manual form completion.</p>
  <input id="name" placeholder="Full name">
  <input id="passport" placeholder="Passport number">
  <input id="phone" placeholder="Phone number">
  <button id="save">Save details</button>
  <button id="fill" class="secondary">Fill current IVAC form</button>
  <button id="open">Open IVAC</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
